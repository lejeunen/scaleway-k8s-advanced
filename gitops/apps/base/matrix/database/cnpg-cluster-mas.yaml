apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: matrix-mas
  namespace: matrix
spec:
  instances: 1

  bootstrap:
    initdb:
      database: mas
      owner: app_admin
      encoding: UTF8
      localeCollate: C
      localeCType: C

  postgresql:
    parameters:
      shared_buffers: "32MB"
      effective_cache_size: "64MB"
      # Unused showcase: MAS' job-queue heartbeat writes ~1 row/s, so the CNPG
      # default archive_timeout=5min forced a WAL switch every 5 min (~288
      # segments/day). Relaxed to 1h -> ~24/day. RPO worsens 5min -> 1h (fine here).
      archive_timeout: "1h"

  storage:
    size: 10Gi

  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: matrix-backup-store

  resources:
    requests:
      memory: 128Mi
    limits:
      memory: 256Mi
