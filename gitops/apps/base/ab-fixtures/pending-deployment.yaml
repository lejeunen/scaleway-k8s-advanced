apiVersion: apps/v1
kind: Deployment
metadata:
  name: pending
  namespace: ab-fixtures
  labels:
    app: pending
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pending
  template:
    metadata:
      labels:
        app: pending
    spec:
      containers:
      - name: app
        image: busybox:1.36
        command: ["sh", "-c", "sleep 3600"]
