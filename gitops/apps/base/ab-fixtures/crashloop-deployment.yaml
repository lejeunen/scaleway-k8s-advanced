apiVersion: apps/v1
kind: Deployment
metadata:
  name: crashloop
  namespace: ab-fixtures
  labels:
    app: crashloop
spec:
  replicas: 1
  selector:
    matchLabels:
      app: crashloop
  template:
    metadata:
      labels:
        app: crashloop
    spec:
      containers:
      - name: app
        image: busybox:1.36
        command: ["sh", "-c", "echo 'starting up'; sleep 3; echo 'FATAL: dependency unavailable' >&2; exit 1"]
