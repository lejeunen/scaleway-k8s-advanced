apiVersion: apps/v1
kind: Deployment
metadata:
  name: error-logger
  namespace: ab-fixtures
  labels:
    app: error-logger
spec:
  replicas: 1
  selector:
    matchLabels:
      app: error-logger
  template:
    metadata:
      labels:
        app: error-logger
    spec:
      containers:
      - name: app
        image: busybox:1.36
        command:
        - sh
        - -c
        - |
          while true; do
            echo "$(date -u +%FT%TZ) INFO  GET /healthz 200"
            sleep 4
            echo "$(date -u +%FT%TZ) ERROR GET /api/orders 500 upstream timeout" >&2
            sleep 6
          done
