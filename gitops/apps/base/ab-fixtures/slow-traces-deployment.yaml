apiVersion: apps/v1
kind: Deployment
metadata:
  name: slow-traces
  namespace: ab-fixtures
  labels:
    app: slow-traces
spec:
  replicas: 1
  selector:
    matchLabels:
      app: slow-traces
  template:
    metadata:
      labels:
        app: slow-traces
    spec:
      containers:
      - name: telemetrygen
        image: ghcr.io/open-telemetry/opentelemetry-collector-contrib/telemetrygen:latest
        args:
        - traces
        - --otlp-endpoint=alloy.monitoring.svc.cluster.local:4318
        - --otlp-http
        - --otlp-insecure
        - --service=ab-slow-svc
        - --span-duration=1500ms
        - --status-code=Error
        - --duration=inf
        - --rate=1
